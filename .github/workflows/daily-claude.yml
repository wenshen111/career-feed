# 每天检查一次：Claude 今天的情报写进来了没有、格式对不对。
#
# 情报本身由 Claude 的定时任务（每天意大利时间 07:47）搜集、去重、提交，见 docs/claude-daily.md。
# 这个检查在它之后跑：UTC 07:30 = 意大利冬令时 08:30。
#   夏令时（3 月最后一个周日起）改成 '30 6 * * *'，保持在意大利 08:30。
# 如果今天没写入，这个检查会失败，GitHub 会给仓库主人发一封失败通知邮件。
name: Claude 每日情报体检

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: # 允许在网页上手动点 “Run workflow”

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验两个情报文件
        run: node scripts/validate.mjs

      - name: 今天 Claude 写入了吗
        run: |
          today=$(TZ=Europe/Rome date +%F)
          updated=$(node -p "require('./feed-claude.json').updated.slice(0,10)")
          if [ "$updated" != "$today" ]; then
            echo "::error::今天（$today）Claude 的情报还没写入，最后一次是 $updated。"
            exit 1
          fi
          echo "今天的情报已写入（$updated）。"

      - name: 检查链接（只提醒）
        run: node scripts/check_links.mjs || true
